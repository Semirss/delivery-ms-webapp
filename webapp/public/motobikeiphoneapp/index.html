    html,

      box-shadow: 0 2px 12px rgba(242,106,84,0.4);

    body[data-device="supported"]:not([data-standalone="true"]) #fullscreen-banner {

    #fullscreen-banner span { flex: 1; }
    #fullscreen-banner button {

      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      background: transparent;

<body>
  <!-- Fullscreen nudge banner (hidden when already standalone/fullscreen) -->
  <div id="fullscreen-banner" role="banner">
    <span>For the best experience, open fullscreen</span>
    <button id="fs-go-btn" type="button">GO FULLSCREEN</button>
    <button class="fs-dismiss" id="fs-dismiss-btn" type="button" aria-label="Dismiss">✕</button>
  </div>

  <div id="unsupported-device" aria-live="polite">
    <div class="unsupported-card">
      <img class="unsupported-logo" src="assets/assets/images/logo.png" alt="MotoBike">
      <h1>Open in mobile</h1>
    </div>
  </div>
  <div id="pwa-install-modal" aria-hidden="true">
    <div class="pwa-install-card" role="dialog" aria-modal="true" aria-labelledby="pwa-install-title">
      <button class="pwa-install-close" id="pwa-install-close" type="button" aria-label="Close">X</button>
      <img class="pwa-install-logo" src="assets/assets/images/logo.png" alt="MotoBike">
      <h2 id="pwa-install-title">Install MotoBike</h2>
      <p id="pwa-install-copy">Open fullscreen from your home screen.</p>
      <button class="pwa-install-primary" id="pwa-install-primary" type="button">INSTALL APP</button>
      <button class="pwa-install-secondary" id="pwa-install-later" type="button">MAYBE LATER</button>
    </div>

  <script>
    /* ── Fullscreen API helper ── */
    (function () {
      function isStandalone() {
        return window.matchMedia("(display-mode: fullscreen)").matches ||
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
      }

      function requestFullscreen() {
        var el = document.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen ||
          el.mozRequestFullScreen || el.msRequestFullscreen;
        if (fn) fn.call(el).catch(function () {});
      }

      function hideBanner() {
        var b = document.getElementById("fullscreen-banner");
        if (b) b.style.display = "none";
      }

      /* Mark standalone so CSS hides the banner */
      if (isStandalone()) {
        document.body.setAttribute("data-standalone", "true");
        hideBanner();
      }

      /* Auto-request fullscreen on first user tap (requires user gesture) */
      var fullscreenRequested = false;
      function onFirstInteraction() {
        if (fullscreenRequested) return;
        fullscreenRequested = true;
        if (!isStandalone()) {
          requestFullscreen();
          hideBanner();
        }
        document.removeEventListener("touchstart", onFirstInteraction);
        document.removeEventListener("click", onFirstInteraction);
      }
      document.addEventListener("touchstart", onFirstInteraction, { once: true, passive: true });
      document.addEventListener("click", onFirstInteraction, { once: true });

      /* Banner buttons */
      document.addEventListener("DOMContentLoaded", function () {
        var goBtn = document.getElementById("fs-go-btn");
        var dismissBtn = document.getElementById("fs-dismiss-btn");
        if (goBtn) goBtn.addEventListener("click", function () {
          requestFullscreen();
          hideBanner();
        });
        if (dismissBtn) dismissBtn.addEventListener("click", hideBanner);

        /* Listen for fullscreen change to hide banner */
        document.addEventListener("fullscreenchange", function () {
          if (document.fullscreenElement) hideBanner();
        });
        document.addEventListener("webkitfullscreenchange", function () {
          if (document.webkitFullscreenElement) hideBanner();
        });
      });
    })();
  </script>
  <script>
    (function () {
      var appScope = "/motobikeiphoneapp/";
      var maxPhoneWidth = 600;
      var flutterScriptId = "flutter-bootstrap-script";
      window.motobikePwaDeferredPrompt = null;
      var installModalShown = false;

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.motobikePwaDeferredPrompt = event;
        updateInstallModal();
        window.setTimeout(showInstallModal, 250);
      });

      window.addEventListener("appinstalled", function () {
        window.motobikePwaDeferredPrompt = null;
        hideInstallModal();
      });

      window.motobikePwaCanPrompt = function () {
        return !!window.motobikePwaDeferredPrompt;
      };

      window.motobikePwaIsStandalone = function () {
        return window.matchMedia("(display-mode: fullscreen)").matches ||
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
      };

      window.motobikePwaPromptInstall = async function () {
        var promptEvent = window.motobikePwaDeferredPrompt;
        if (!promptEvent) return { supported: false, outcome: "unavailable" };
        promptEvent.prompt();
        var choice = await promptEvent.userChoice;
        window.motobikePwaDeferredPrompt = null;
        return { supported: true, outcome: choice && choice.outcome };
      };

      function installReliableBrowserGps() {
        var geolocation = window.navigator.geolocation;
        if (!geolocation || geolocation.__motobikeReliableGps) return;

        var nativeGetCurrentPosition = geolocation.getCurrentPosition.bind(geolocation);
        var nativeWatchPosition = geolocation.watchPosition &&
          geolocation.watchPosition.bind(geolocation);
        var nativeClearWatch = geolocation.clearWatch &&
          geolocation.clearWatch.bind(geolocation);
        if (!nativeWatchPosition || !nativeClearWatch) return;

        function reliableGetCurrentPosition(onSuccess, onError, options) {
          var finished = false;
          var bestPosition = null;
          var watchId = null;
          var settleTimer = null;
          var excellentTimer = null;

          function accuracyOf(position) {
            var accuracy = position && position.coords && position.coords.accuracy;
            return Number.isFinite(accuracy) && accuracy > 0
              ? accuracy
              : Number.POSITIVE_INFINITY;
          }

          function cleanUp() {
            if (watchId !== null) nativeClearWatch(watchId);
            window.clearTimeout(settleTimer);
            window.clearTimeout(excellentTimer);
            window.clearTimeout(hardTimer);
          }

          function finish(position, error) {
            if (finished) return;
            finished = true;
            cleanUp();
            if (position) {
              onSuccess(position);
            } else if (typeof onError === "function") {
              onError(error);
            }
          }

          function consider(position) {
            if (!bestPosition || accuracyOf(position) < accuracyOf(bestPosition)) {
              bestPosition = position;
            }
            if (!settleTimer) {
              settleTimer = window.setTimeout(function () {
                finish(bestPosition, null);
              }, 3500);
            }
            if (accuracyOf(bestPosition) <= 50 && !excellentTimer) {
              excellentTimer = window.setTimeout(function () {
                finish(bestPosition, null);
              }, 350);
            }
          }

          var requestedOptions = options || {};
          var gpsOptions = {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: Math.min(
              Number.isFinite(requestedOptions.timeout)
                ? requestedOptions.timeout
                : 8000,
              8000
            )
          };
          var hardTimer = window.setTimeout(function () {
            if (bestPosition) {
              finish(bestPosition, null);
              return;
            }
            nativeGetCurrentPosition(onSuccess, onError, gpsOptions);
            cleanUp();
            finished = true;
          }, 8500);

          try {
            watchId = nativeWatchPosition(consider, function (error) {
              finish(bestPosition, error);
            }, gpsOptions);
          } catch (error) {
            cleanUp();
            finished = true;
            nativeGetCurrentPosition(onSuccess, onError, gpsOptions);
          }
        }

        try {
          geolocation.getCurrentPosition = reliableGetCurrentPosition;
          geolocation.__motobikeReliableGps = true;
        } catch (_) {}
      }

      function ignoreForbiddenBrowserHeaders() {
        var prototype = window.XMLHttpRequest && window.XMLHttpRequest.prototype;
        if (!prototype || prototype.__motobikeSafeHeaders) return;
        var nativeSetRequestHeader = prototype.setRequestHeader;
        prototype.setRequestHeader = function (name, value) {
          if (String(name).toLowerCase() === "user-agent") return;
          return nativeSetRequestHeader.call(this, name, value);
        };
        prototype.__motobikeSafeHeaders = true;
      }

      function isIosDevice() {
        var ua = window.navigator.userAgent.toLowerCase();
        var platform = (window.navigator.platform || "").toLowerCase();
        return ua.indexOf("iphone") >= 0 ||
          ua.indexOf("ipad") >= 0 ||
          ua.indexOf("ipod") >= 0 ||
          (platform.indexOf("mac") >= 0 && window.navigator.maxTouchPoints > 1);
      }

      function installModalElements() {
        return {
          modal: document.getElementById("pwa-install-modal"),
          copy: document.getElementById("pwa-install-copy"),
          primary: document.getElementById("pwa-install-primary"),
          close: document.getElementById("pwa-install-close"),
          later: document.getElementById("pwa-install-later")
        };
      }

      function updateInstallModal() {
        var el = installModalElements();
        if (!el.modal || !el.copy || !el.primary) return;
        if (isIosDevice()) {
          el.copy.textContent = "Tap Share, then Add to Home Screen.";
          el.primary.textContent = "GOT IT";
          return;
        }
        if (window.motobikePwaDeferredPrompt) {
          el.copy.textContent = "Install for fullscreen app mode.";
          el.primary.textContent = "INSTALL APP";
          return;
        }
        el.copy.textContent = "Open Chrome menu, then Add to Home screen.";
        el.primary.textContent = "OPEN MENU";
      }

      function showInstallModal() {
        if (installModalShown ||
          window.motobikePwaIsStandalone() ||
          document.body.dataset.device !== "supported") {
          return;
        }
        var el = installModalElements();
        if (!el.modal) return;
        updateInstallModal();
        installModalShown = true;
        el.modal.classList.add("is-visible");
        el.modal.setAttribute("aria-hidden", "false");
      }

      function hideInstallModal() {
        var el = installModalElements();
        if (!el.modal) return;
        el.modal.classList.remove("is-visible");
        el.modal.setAttribute("aria-hidden", "true");
      }

      async function handleInstallPrimary() {
        if (window.motobikePwaDeferredPrompt) {
          await window.motobikePwaPromptInstall();
        }
        hideInstallModal();
      }

      function scheduleInstallModal() {
        window.setTimeout(showInstallModal, 1200);
      }

      function isPortraitPhone() {
        return window.innerWidth <= maxPhoneWidth && window.innerHeight >= window.innerWidth;
      }

      function loadFlutter() {
        if (document.getElementById(flutterScriptId)) return;
        var script = document.createElement("script");
        script.id = flutterScriptId;
        script.src = "flutter_bootstrap.js";
        script.async = true;
        document.body.appendChild(script);
      }

      function applyDeviceGate() {
        var supported = isPortraitPhone();
        document.body.dataset.device = supported ? "supported" : "unsupported";
        if (supported) {
          loadFlutter();
          scheduleInstallModal();
        } else {
          hideInstallModal();
        }
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register(appScope + "sw.js", { scope: appScope })
            .catch(function () {});
        });
      }

      var installEls = installModalElements();
      if (installEls.primary) installEls.primary.addEventListener("click", handleInstallPrimary);
      if (installEls.close) installEls.close.addEventListener("click", hideInstallModal);
      if (installEls.later) installEls.later.addEventListener("click", hideInstallModal);

      installReliableBrowserGps();
      ignoreForbiddenBrowserHeaders();
      applyDeviceGate();
      window.addEventListener("load", scheduleInstallModal);
      window.addEventListener("resize", applyDeviceGate);
      window.addEventListener("orientationchange", applyDeviceGate);
    })();
  </script>
