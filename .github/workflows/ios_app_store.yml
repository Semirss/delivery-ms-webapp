name: iOS App Store Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        required: true
        default: both
        type: choice
        options:
          - both
          - client
          - driver
      build_name:
        description: Optional version name, for example 1.0.4. Blank uses pubspec.yaml.
        required: false
        type: string
      build_number:
        description: Optional App Store build number. Blank uses a high GitHub run number.
        required: false
        type: string
      upload_to_app_store_connect:
        description: Upload IPA to App Store Connect after building
        required: true
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install iOS signing tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/codemagic-cli-tools"
          "$RUNNER_TEMP/codemagic-cli-tools/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/codemagic-cli-tools/bin/python" -m pip install codemagic-cli-tools
          echo "$RUNNER_TEMP/codemagic-cli-tools/bin" >> "$GITHUB_PATH"

      - name: Build selected app
        shell: bash
        env:
          SELECTED_APP: ${{ inputs.app }}
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          UPLOAD_TO_APP_STORE_CONNECT: ${{ inputs.upload_to_app_store_connect }}
          CLIENT_DOTENV_BASE64: ${{ secrets.CLIENT_DOTENV_BASE64 }}
          DRIVER_DOTENV_BASE64: ${{ secrets.DRIVER_DOTENV_BASE64 }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          }

          require_secret APP_STORE_CONNECT_ISSUER_ID
          require_secret APP_STORE_CONNECT_KEY_IDENTIFIER
          require_secret APP_STORE_CONNECT_PRIVATE_KEY
          require_secret CERTIFICATE_PRIVATE_KEY

          build_app() {
            local label="$1"
            local app_dir="$2"
            local bundle_id="$3"
            local dotenv_secret_name="$4"
            local dotenv_value="${!dotenv_secret_name:-}"

            if [ -z "$dotenv_value" ]; then
              echo "::error::Missing GitHub secret: $dotenv_secret_name"
              exit 1
            fi

            echo "Building $label with bundle ID $bundle_id"

            cd "$GITHUB_WORKSPACE/$app_dir"
            DOTENV_VALUE="$dotenv_value" python3 -c 'import base64, os; from pathlib import Path; Path(".env").write_bytes(base64.b64decode(os.environ["DOTENV_VALUE"]))'

            pubspec_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
            build_name="${INPUT_BUILD_NAME:-${pubspec_version%%+*}}"
            build_number="${INPUT_BUILD_NUMBER:-$((100000 + GITHUB_RUN_NUMBER))}"

            flutter pub get
            flutter test

            keychain initialize
            app-store-connect fetch-signing-files "$bundle_id" \
              --platform IOS \
              --type IOS_APP_STORE \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
              --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
              --create
            keychain add-certificates
            xcode-project use-profiles --project ios/Runner.xcodeproj

            flutter build ipa \
              --release \
              --build-name "$build_name" \
              --build-number "$build_number" \
              --export-options-plist "$HOME/export_options.plist"

            mkdir -p "$GITHUB_WORKSPACE/build_artifacts/$label"
            cp build/ios/ipa/*.ipa "$GITHUB_WORKSPACE/build_artifacts/$label/"

            if [ "$UPLOAD_TO_APP_STORE_CONNECT" = "true" ]; then
              app-store-connect publish \
                --path "$(find build/ios/ipa -name '*.ipa' -print -quit)" \
                --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
                --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
                --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY
            fi

            keychain use-login
          }

          case "$SELECTED_APP" in
            client)
              build_app client client_app/client_app com.motobikedeliveryservice.client CLIENT_DOTENV_BASE64
              ;;
            driver)
              build_app driver driver_app/driver_app com.motobikedeliveryservice.driver DRIVER_DOTENV_BASE64
              ;;
            both)
              build_app client client_app/client_app com.motobikedeliveryservice.client CLIENT_DOTENV_BASE64
              build_app driver driver_app/driver_app com.motobikedeliveryservice.driver DRIVER_DOTENV_BASE64
              ;;
            *)
              echo "::error::Unknown app selection: $SELECTED_APP"
              exit 1
              ;;
          esac

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.app }}
          path: build_artifacts/**/*.ipa
          if-no-files-found: error
